<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sorting Lab | Benchmark Dashboard</title><style>body{font-family:Segoe UI,Arial;background:#f5f7fb;color:#1c2841;margin:0}header{background:#142c53;color:white;padding:25px 5%}main{max-width:1150px;margin:auto;padding:22px}section{background:white;padding:22px;border-radius:14px;margin:16px 0;box-shadow:0 3px 15px #0001}h1{margin:0}small{color:#64748b}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.kpi{background:#edf4ff;padding:15px;border-radius:10px}.num{font-size:25px;font-weight:700}label{margin-right:10px}input{padding:8px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #e5e7eb;text-align:left;padding:10px}svg{max-width:100%}.bar{fill:#3275c7}.bar:hover{fill:#f18b36}</style><header><h1>Sorting Lab — Benchmark Dashboard</h1><p>CSV → Benchmark → Power BI | Offline interactive preview</p></header><main><section><strong>Load results CSV:</strong> <input type="file" id="csv" accept=".csv"> <small>CSV from Sorting Lab; default view uses bundled benchmark, not authenticated Kaggle data.</small></section><section><div class="kpis" id="kpis"></div></section><section><h2>Median runtime by algorithm (ms)</h2><div id="bars"></div></section><section><h2>Benchmark detail</h2><div style="overflow-x:auto"><table><thead><tr><th>Algorithm</th><th>n</th><th>Median ms</th><th>Peak KB</th><th>Status</th><th>Dataset</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
let rows=[{"dataset": "synthetic_retail_orders.csv", "column": "Sales", "algorithm": "insertion", "n": "300", "median_ms": "1.240216", "peak_kb": "2.543", "status": "ok", "reason": ""}, {"dataset": "synthetic_retail_orders.csv", "column": "Sales", "algorithm": "merge", "n": "300", "median_ms": "0.308183", "peak_kb": "5.168", "status": "ok", "reason": ""}, {"dataset": "synthetic_retail_orders.csv", "column": "Sales", "algorithm": "quick_last", "n": "300", "median_ms": "0.216817", "peak_kb": "2.781", "status": "ok", "reason": ""}, {"dataset": "synthetic_retail_orders.csv", "column": "Sales", "algorithm": "quick_mo3", "n": "300", "median_ms": "0.233823", "peak_kb": "2.867", "status": "ok", "reason": ""}, {"dataset": "synthetic_retail_orders.csv", "column": "Sales", "algorithm": "heap", "n": "300", "median_ms": "0.483795", "peak_kb": "2.758", "status": "ok", "reason": ""}, {"dataset": "synthetic_retail_orders.csv", "column": "Sales", "algorithm": "timsort", "n": "300", "median_ms": "0.008141", "peak_kb": "2.414", "status": "ok", "reason": ""}];
function parseCSV(s){let lines=s.replace(/^\uFEFF/,'').trim().split(/\r?\n/);let header=lines.shift().split(',');return lines.map(l=>{let a=l.split(',');return Object.fromEntries(header.map((k,i)=>[k,a[i]||'']))})}
function render(){let valid=rows.filter(r=>r.status==='ok'&&Number.isFinite(+r.median_ms));let min=Math.min(...valid.map(r=>+r.median_ms));let avg=valid.length?valid.reduce((s,r)=>s+(+r.median_ms),0)/valid.length:0;let memory=valid.length?valid.reduce((s,r)=>s+(+r.peak_kb||0),0)/valid.length:0;document.getElementById('kpis').innerHTML=[['Algorithms',rows.length],['Successful',valid.length],['Best runtime (ms)',Number.isFinite(min)?min.toFixed(3):'—'],['Avg runtime (ms)',avg.toFixed(3)],['Avg peak KB',memory.toFixed(2)]].map(([a,b])=>`<div class="kpi">${a}<div class="num">${b}</div></div>`).join('');let max=Math.max(1,...valid.map(r=>+r.median_ms));document.getElementById('bars').innerHTML=valid.slice().sort((a,b)=>+a.median_ms-+b.median_ms).map(r=>`<div style="display:flex;align-items:center;gap:12px;margin:10px 0"><div style="width:115px">${r.algorithm}</div><div style="height:23px;background:#3275c7;width:${Math.max(2,Math.round(+r.median_ms/max*75))}%;border-radius:4px"></div><b>${(+r.median_ms).toFixed(3)}</b></div>`).join('');document.getElementById('rows').innerHTML=rows.map(r=>`<tr>${['algorithm','n','median_ms','peak_kb','status','dataset'].map(k=>`<td>${String(r[k]||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}</td>`).join('')}</tr>`).join('')}
document.getElementById('csv').onchange=async e=>{if(e.target.files[0]){rows=parseCSV(await e.target.files[0].text());render()}};render();
</script></html>
