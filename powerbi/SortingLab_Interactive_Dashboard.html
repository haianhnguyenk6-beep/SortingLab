<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sorting Lab | Benchmark Dashboard</title><style>body{font-family:Segoe UI,Arial;background:#f5f7fb;color:#1c2841;margin:0}header{background:#142c53;color:white;padding:25px 5%}main{max-width:1150px;margin:auto;padding:22px}section{background:white;padding:22px;border-radius:14px;margin:16px 0;box-shadow:0 3px 15px #0001}h1{margin:0}small{color:#64748b}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.kpi{background:#edf4ff;padding:15px;border-radius:10px}.num{font-size:25px;font-weight:700}label{margin-right:10px}input{padding:8px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #e5e7eb;text-align:left;padding:10px}svg{max-width:100%}.bar{fill:#3275c7}.bar:hover{fill:#f18b36}</style><header><h1>Sorting Lab — Benchmark Dashboard</h1><p>CSV → Benchmark → Power BI | Offline interactive preview</p></header><main><section><strong>Load results CSV:</strong> <input type="file" id="csv" accept=".csv"> <small>CSV from Sorting Lab; default view uses bundled benchmark, not authenticated Kaggle data.</small><p id="csv-status" role="status"></p></section><section><div class="kpis" id="kpis"></div></section><section><h2>Median runtime by algorithm (ms)</h2><div id="bars"></div></section><section><h2>Benchmark detail</h2><div style="overflow-x:auto"><table><thead><tr><th>Algorithm</th><th>n</th><th>Median ms</th><th>Peak KB</th><th>Status</th><th>Dataset</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
let rows=[{"dataset": "synthetic_retail_orders.csv", "column": "Sales", "algorithm": "insertion", "n": "300", "median_ms": "1.240216", "peak_kb": "2.543", "status": "ok", "reason": ""}, {"dataset": "synthetic_retail_orders.csv", "column": "Sales", "algorithm": "merge", "n": "300", "median_ms": "0.308183", "peak_kb": "5.168", "status": "ok", "reason": ""}, {"dataset": "synthetic_retail_orders.csv", "column": "Sales", "algorithm": "quick_last", "n": "300", "median_ms": "0.216817", "peak_kb": "2.781", "status": "ok", "reason": ""}, {"dataset": "synthetic_retail_orders.csv", "column": "Sales", "algorithm": "quick_mo3", "n": "300", "median_ms": "0.233823", "peak_kb": "2.867", "status": "ok", "reason": ""}, {"dataset": "synthetic_retail_orders.csv", "column": "Sales", "algorithm": "heap", "n": "300", "median_ms": "0.483795", "peak_kb": "2.758", "status": "ok", "reason": ""}, {"dataset": "synthetic_retail_orders.csv", "column": "Sales", "algorithm": "timsort", "n": "300", "median_ms": "0.008141", "peak_kb": "2.414", "status": "ok", "reason": ""}];
function parseCSV(text) {
  text = String(text).replace(/^\uFEFF/, '');
  const records = [];
  let row = [], field = '', quoted = false, closed = false;
  function finishRow() {
    const blank = row.length === 0 && field === '' && !closed;
    row.push(field);
    if (!blank) records.push(row);
    row = []; field = ''; closed = false;
  }
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else { quoted = false; closed = true; }
      } else field += c;
    } else if (c === '"') {
      if (field !== '' || closed) throw new Error('Dấu ngoặc kép sai vị trí trong CSV.');
      quoted = true;
    } else if (c === ',') {
      row.push(field); field = ''; closed = false;
    } else if (c === '\r' || c === '\n') {
      finishRow();
      if (c === '\r' && text[i + 1] === '\n') i++;
    } else {
      if (closed) throw new Error('Có ký tự ngoài ô CSV đã đóng ngoặc kép.');
      field += c;
    }
  }
  if (quoted) throw new Error('CSV có ô chưa đóng ngoặc kép.');
  if (field !== '' || row.length || closed) finishRow();
  if (!records.length) throw new Error('CSV trống hoặc thiếu tiêu đề.');
  const headers = records.shift().map(name => name.trim());
  if (headers.some(name => !name) || new Set(headers).size !== headers.length) {
    throw new Error('Tiêu đề CSV trống hoặc bị trùng.');
  }
  return records.map((values, index) => {
    if (values.length !== headers.length) {
      throw new Error('Bản ghi ' + (index + 2) + ' không khớp số cột trong tiêu đề.');
    }
    return Object.fromEntries(headers.map((name, i) => [name, values[i]]));
  });
}
function escapeHTML(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, c =>
    ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
}
function finiteNumber(value) {
  return value != null && String(value).trim() !== '' && Number.isFinite(Number(value));
}
function render() {
  const valid = rows.filter(r => r.status === 'ok' && finiteNumber(r.median_ms) && +r.median_ms >= 0);
  const min = valid.length ? Math.min(...valid.map(r => +r.median_ms)) : null;
  const avg = valid.length ? valid.reduce((sum, r) => sum + +r.median_ms, 0) / valid.length : null;
  const memoryRows = valid.filter(r => finiteNumber(r.peak_kb) && +r.peak_kb >= 0);
  const memory = memoryRows.length ? memoryRows.reduce((sum, r) => sum + +r.peak_kb, 0) / memoryRows.length : null;
  const format = value => value == null ? '—' : value.toFixed(3);
  const algorithms = new Set(rows.map(r => r.algorithm).filter(Boolean)).size;
  document.getElementById('kpis').innerHTML = [
    ['Algorithms', algorithms], ['Successful', valid.length],
    ['Best runtime (ms)', format(min)], ['Avg runtime (ms)', format(avg)],
    ['Avg peak KB', format(memory)]
  ].map(([label, value]) => '<div class="kpi">' + label + '<div class="num">' + value + '</div></div>').join('');
  const max = Math.max(1, ...valid.map(r => +r.median_ms));
  document.getElementById('bars').innerHTML = valid.slice().sort((a,b) => +a.median_ms - +b.median_ms).map(r =>
    '<div style="display:flex;align-items:center;gap:12px;margin:10px 0"><div style="width:115px">'
    + escapeHTML(r.algorithm) + '</div><div style="height:23px;background:#3275c7;width:'
    + Math.max(2, Math.round(+r.median_ms / max * 75))
    + '%;border-radius:4px"></div><b>' + (+r.median_ms).toFixed(3) + '</b></div>'
  ).join('');
  document.getElementById('rows').innerHTML = rows.map(r => '<tr>' +
    ['algorithm','n','median_ms','peak_kb','status','dataset'].map(key =>
      '<td>' + escapeHTML(r[key]) + '</td>').join('') + '</tr>').join('');
}
document.getElementById('csv').onchange = async event => {
  const file = event.target.files[0];
  if (!file) return;
  const status = document.getElementById('csv-status');
  try {
    const parsed = parseCSV(await file.text());
    const required = ['algorithm', 'median_ms', 'status'];
    if (parsed.length && required.some(key => !Object.hasOwn(parsed[0], key))) {
      throw new Error('CSV cần có các cột algorithm, median_ms và status.');
    }
    rows = parsed;
    render();
    status.textContent = 'Đã đọc ' + rows.length + ' bản ghi từ ' + file.name + '.';
  } catch (error) {
    status.textContent = 'Không đọc được CSV: ' + error.message;
  }
};
render();
</script></html>
